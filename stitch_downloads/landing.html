<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>VIBE_GEN - Hackers House Shortlisting</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'JetBrains Mono', monospace;
        }
        
        .typing-container {
            display: inline-block;
            max-width: fit-content;
        }

        .typing-effect {
            overflow: hidden;
            white-space: nowrap;
            border-right: 0.15em solid black;
            animation: typing 1.5s steps(20, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: black; }
        }
        
        .hover-invert:hover {
            background-color: #FFFFFF !important;
            color: #000000 !important;
            border-color: #000000 !important;
        }
    </style>
</head>
<body class="bg-white text-black min-h-screen flex flex-col antialiased relative overflow-x-hidden selection:bg-black selection:text-white">
<!-- TopAppBar -->
<header class="bg-white text-black docked full-width top-0 sticky border-b border-black flex justify-between items-center px-4 md:px-8 w-full h-16 z-50">
<div class="text-sm font-light tracking-tight">
            &lt;App id="hh-goa-26" mode="production" /&gt;
        </div>
<div class="text-sm hidden md:block">
            [ - ] [ + ] [ x ]
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col relative z-10 pb-32 md:pb-16 pt-16 md:pt-32 px-6 md:px-16">
<div class="w-full max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-16">
<!-- Left Side: Content -->
<div class="md:col-span-6 flex flex-col items-start space-y-12">
<!-- Status Chip -->
<div class="inline-flex items-center space-x-2 px-3 py-1 border border-black text-xs">
<span class="w-2 h-2 bg-black animate-pulse"></span>
<span>&gt; SYSTEM_LIVE</span>
</div>
<!-- Headline -->
<div class="space-y-6">
<div class="typing-container">
<h1 class="text-[2.5rem] md:text-[5rem] font-extrabold leading-none tracking-tight typing-effect">
                            VIBE_GEN
                        </h1>
</div>
<p class="text-lg md:text-xl font-normal text-gray-800 max-w-xl">
                        Generate your elite candidate card for Hackers House 2024.
                    </p>
</div>
<!-- Main CTA -->
<div class="pt-4">
<button class="inline-flex items-center justify-center px-8 py-4 bg-black text-white border border-black rounded-none transition-none text-base font-bold hover-invert">
                        &gt; execute.buildCard()
                    </button>
</div>
<!-- Decorative Data Points -->
<div class="grid grid-cols-2 md:grid-cols-2 gap-0 w-full max-w-lg border-t border-l border-black mt-12">
<div class="flex flex-col items-start p-4 border-b border-r border-black hover:bg-black hover:text-white transition-none group">
<span class="text-2xl font-bold">0.9s</span>
<span class="text-xs mt-2 opacity-70 group-hover:opacity-100">&gt; GEN_TIME</span>
</div>
<div class="flex flex-col items-start p-4 border-b border-r border-black hover:bg-black hover:text-white transition-none group">
<span class="text-2xl font-bold">10k+</span>
<span class="text-xs mt-2 opacity-70 group-hover:opacity-100">&gt; VIBES_CHECKED</span>
</div>
<div class="flex flex-col items-start p-4 border-b border-r border-black hover:bg-black hover:text-white transition-none group">
<span class="text-2xl font-bold">99%</span>
<span class="text-xs mt-2 opacity-70 group-hover:opacity-100">&gt; ACCURACY</span>
</div>
<div class="flex flex-col items-start p-4 border-b border-r border-black hover:bg-black hover:text-white transition-none group">
<span class="text-2xl font-bold text-red-600 group-hover:text-red-400">SYS_OK</span>
<span class="text-xs mt-2 opacity-70 group-hover:opacity-100">&gt; STATUS</span>
</div>
</div>
</div>
<!-- Right Side: IDE / Terminal Window (Desktop only for visual balance) -->
<div class="hidden md:flex md:col-span-6 flex-col border border-black bg-white">
<div class="border-b border-black px-4 py-2 flex justify-between items-center bg-white text-xs">
<span>terminal.exe</span>
<span>[ - ] [ + ] [ x ]</span>
</div>
<div class="p-8 flex-grow flex items-center justify-center text-gray-500 text-sm">
                    // Drop payload here or click to init()
                </div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full px-4 py-2 flex justify-between items-center bg-white border-t border-black z-50">
<a class="flex flex-col items-center justify-center text-black p-3 hover:bg-black hover:text-white transition-none border border-transparent hover:border-black" href="#">
<span>[H]</span>
</a>
<a class="flex flex-col items-center justify-center text-black p-3 hover:bg-black hover:text-white transition-none border border-transparent hover:border-black" href="#">
<span>[+]</span>
</a>
<a class="flex flex-col items-center justify-center text-black p-3 hover:bg-black hover:text-white transition-none border border-transparent hover:border-black" href="#">
<span>[*]</span>
</a>
<a class="flex flex-col items-center justify-center text-black p-3 hover:bg-black hover:text-white transition-none border border-transparent hover:border-black" href="#">
<span>[&gt;]</span>
</a>
</nav>
</body></html>
